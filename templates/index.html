<div class="button-group">
    <a href="{{ url_for('menu') }}" class="btn btn-menu">
        <i class="fas fa-utensils"></i> VIEW MENU
    </a>
</div>

<script>
    function checkPasscode() {
        const code = document.getElementById('passcodeField').value;
        
        if (!code) {
            alert("Please enter a passcode");
            return;
        }

        // We create a hidden form to send a POST request to your /admin-login route
        const form = document.createElement('form');
        form.method = 'POST';
        
        // This matches @app.route('/admin-login') in your app.py
        form.action = "{{ url_for('admin_login') }}"; 

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'passcode';
        input.value = code;

        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();
    }
</script>
